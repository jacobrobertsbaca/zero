name: Supabase Dry-run

on:
  pull_request:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-dryrun.yml'
  workflow_dispatch:

jobs:
  dryrun:
    name: Dry-run production push
    runs-on: ubuntu-latest

    env:
      PRODUCTION_DB_URL: ${{ secrets.PRODUCTION_DB_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Preview pending migrations
        run: supabase db push --dry-run --db-url "$PRODUCTION_DB_URL"
